<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メンバー記憶ページ</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--ink:#17202a;--sub:#697386;--line:#e6e8ef;--green:#10b981;--red:#ef4444;--blue:#4f46e5}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Yu Gothic",Meiryo,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .wrap{max-width:1160px;margin:0 auto;padding:20px}
    h1{margin:0 0 8px;font-size:clamp(28px,4vw,44px);letter-spacing:.04em}
    .lead{margin:0;color:var(--sub);line-height:1.7}
    .toolbar{display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;margin-top:16px}
    input,textarea,button{font:inherit}
    input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;outline:none}
    button{border:0;border-radius:14px;padding:12px 16px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}
    button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
    button.green{background:var(--green)}
    button.danger{background:var(--red)}
    button.small{padding:9px 12px;border-radius:11px;font-size:14px}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 22px}
    .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--sub)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(320px,1fr));gap:26px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 12px 30px rgba(16,24,40,.07)}
    .thumb{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#eef2ff,#ecfeff);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#7a8798;font-weight:800;text-align:center;padding:12px}
    .thumb img{width:100%;height:100%;object-fit:contain;display:block}
    .numBadge{position:absolute;top:10px;left:10px;background:rgba(24,32,42,.86);color:#fff;border-radius:999px;min-width:30px;height:30px;padding:0 9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;z-index:2}
    .body{padding:18px}
    .titleRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .name{font-size:25px;font-weight:900;margin:0}
    .imgNo{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 9px;border-radius:999px;background:#edf2ff;color:#334155;font-size:13px;font-weight:900;border:1px solid #dce4ff}
    .file{font-size:13px;color:var(--sub);word-break:break-all;margin-top:10px}
    .memo{margin-top:12px;color:#344054;line-height:1.65;white-space:pre-wrap}
    .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
    .hidden{display:none!important}
    dialog{border:0;border-radius:22px;padding:0;max-width:620px;width:calc(100% - 32px);box-shadow:0 24px 80px rgba(0,0,0,.25)}
    dialog::backdrop{background:rgba(15,23,42,.45)}
    .modal{padding:22px}
    .modal h2{margin:0 0 14px}
    .form{display:grid;gap:12px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .right{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
    .hint{font-size:13px;color:var(--sub);line-height:1.7}
    @media(max-width:760px){.toolbar{grid-template-columns:1fr}.row{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.wrap{padding:14px}.thumb{aspect-ratio:4/3}}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>メンバー記憶ページ</h1>
    <p class="lead">画像はGitHub上の <b>img</b> フォルダから読み込みます。画像名が一致すると表示されます。</p>
    <div class="toolbar">
      <input id="search" placeholder="名前・画像名・メモで検索">
      <button class="green" id="addBtn">＋追加</button>
      <button class="secondary" id="exportBtn">保存データ書き出し</button>
      <button class="secondary" id="importBtn">読み込み</button>
      <button class="secondary" id="resetBtn">初期データに戻す</button>
      <input type="file" id="importFile" accept="application/json" class="hidden">
    </div>
  </div>
</header>

<main class="wrap">
  <div class="stats">
    <span class="pill" id="count"></span>
    <span class="pill">PCは一行2人</span>
    <span class="pill">画像は全体表示</span>
    <span class="pill">読み込み先：img/画像名</span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="dialog">
  <form method="dialog" class="modal" id="memberForm">
    <h2 id="modalTitle">メンバー編集</h2>
    <div class="form">
      <input type="hidden" id="editId">
      <label>名前<input id="name" required placeholder="例：アモン"></label>
      <div class="row">
        <label>画像ファイル1<input id="image1" placeholder="例：アモン.png"></label>
        <label>画像ファイル2<input id="image2" placeholder="例：タマ2.png"></label>
      </div>
      <label>メモ<textarea id="memo" rows="5" placeholder="メモ、キャラ設定など"></textarea></label>
      <p class="hint">画像は <b>img/アモン.png</b> のように読み込みます。GitHubのimgフォルダ内のファイル名と完全一致させてください。</p>
    </div>
    <div class="right">
      <button type="button" class="secondary" id="cancelBtn">キャンセル</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>

<script>
const initialMembers = [
  {id:'m001', name:'ぬんだこのー', image1:'ぬんだこのー.png', image2:'', memo:''},
  {id:'m002', name:'アモン', image1:'アモン.png', image2:'', memo:''},
  {id:'m003', name:'キュン', image1:'キュン.png', image2:'', memo:''},
  {id:'m004', name:'れいちゃん', image1:'れいちゃん.png', image2:'', memo:''},
  {id:'m005', name:'Ryo', image1:'Ryo.png', image2:'', memo:''},
  {id:'m006', name:'わかめ閣下カッカ', image1:'わかめ閣下.png', image2:'', memo:''},
  {id:'m007', name:'崖玄', image1:'崖玄.png', image2:'', memo:''},
  {id:'m008', name:'バルバロッサ', image1:'バルバロッサ.png', image2:'', memo:''},
  {id:'m009', name:'KazNaka', image1:'KazNaka.png', image2:'', memo:''},
  {id:'m010', name:'Yuko', image1:'Yuko.png', image2:'', memo:''},
  {id:'m011', name:'STONE', image1:'STONE.png', image2:'', memo:''},
  {id:'m012', name:'ぴえろ', image1:'ぴえろ.png', image2:'', memo:''},
  {id:'m013', name:'神鎧', image1:'神鎧.png', image2:'', memo:''},
  {id:'m014', name:'上村友二', image1:'上村友二.png', image2:'', memo:''},
  {id:'m015', name:'アスカ', image1:'アスカ.png', image2:'', memo:''},
  {id:'m016', name:'風雲', image1:'風雲.png', image2:'', memo:''},
  {id:'m017', name:'タマ', image1:'タマ.png', image2:'タマ2.png', memo:''},
  {id:'m018', name:'SHINOBU', image1:'SHINOBU.png', image2:'', memo:''},
  {id:'m019', name:'たかゆき', image1:'たかゆき.png', image2:'', memo:''},
  {id:'m020', name:'ふじ', image1:'ふじさん.png', image2:'', memo:''},
  {id:'m021', name:'かっぱちゃん', image1:'かっぱちゃん.png', image2:'かっぱちゃん2.png', memo:''},
  {id:'m022', name:'皇帝ペンギン', image1:'皇帝ペンギン.png', image2:'', memo:''},
  {id:'m023', name:'ミートウ', image1:'ミートウ.png', image2:'', memo:''},
  {id:'m024', name:'ゴリラ丸', image1:'ゴリラ丸.png', image2:'', memo:''},
  {id:'m025', name:'桃じり麗', image1:'桃じり麗.png', image2:'', memo:''},
  {id:'m026', name:'舜天', image1:'舜天.png', image2:'', memo:''},
  {id:'m027', name:'獅子神楽', image1:'獅子神楽.png', image2:'獅子神楽2.png', memo:''},
  {id:'m028', name:'みっか', image1:'みっか.png', image2:'', memo:''},
  {id:'m029', name:'エタニティー', image1:'エタニティー.png', image2:'', memo:''}
];

const KEY = 'member-memory-v3-img-folder';
let members = JSON.parse(localStorage.getItem(KEY) || 'null') || initialMembers;

const $ = s => document.querySelector(s);
const esc = s => String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){ localStorage.setItem(KEY, JSON.stringify(members)); }

function imagePath(file){
  return 'img/' + String(file || '').split('/').map(encodeURIComponent).join('/');
}

function imgBox(file, name, no){
  if(!file) return `<div class="thumb"><span class="numBadge">${no}</span>画像未設定</div>`;
  const src = imagePath(file);
  return `<div class="thumb"><span class="numBadge">${no}</span><img src="${src}" alt="${esc(name)} 画像${no}" loading="lazy" onerror="this.remove();this.parentElement.innerHTML='<span class=&quot;numBadge&quot;>${no}</span>画像なし：${esc(file)}';"></div>`;
}

function makeCards(list){
  const cards = [];
  list.forEach(m => {
    cards.push({...m, imageFile:m.image1, no:'1'});
    if(m.image2) cards.push({...m, imageFile:m.image2, no:'2'});
  });
  return cards;
}

function render(){
  const q = $('#search').value.trim().toLowerCase();
  const filtered = members.filter(m => (m.name + ' ' + m.image1 + ' ' + m.image2 + ' ' + m.memo).toLowerCase().includes(q));
  const cards = makeCards(filtered);
  $('#count').textContent = `登録 ${members.length}件 / 表示 ${cards.length}枚`;
  $('#grid').innerHTML = cards.map(c => `
    <article class="card">
      ${imgBox(c.imageFile, c.name, c.no)}
      <div class="body">
        <div class="titleRow"><h3 class="name">${esc(c.name)}</h3><span class="imgNo">${c.no}</span></div>
        <div class="file">画像${c.no}：${esc(c.imageFile || '未設定')}</div>
        ${c.memo ? `<div class="memo">${esc(c.memo)}</div>` : ''}
        <div class="actions">
          <button class="small secondary" onclick="editMember('${c.id}')">編集</button>
          <button class="small danger" onclick="deleteMember('${c.id}')">削除</button>
        </div>
      </div>
    </article>
  `).join('');
}

function openModal(member){
  $('#memberForm').reset();
  $('#editId').value = member?.id || '';
  $('#modalTitle').textContent = member ? 'メンバー編集' : 'メンバー追加';
  $('#name').value = member?.name || '';
  $('#image1').value = member?.image1 || '';
  $('#image2').value = member?.image2 || '';
  $('#memo').value = member?.memo || '';
  $('#dialog').showModal();
}

window.editMember = id => openModal(members.find(m => m.id === id));
window.deleteMember = id => {
  if(confirm('削除しますか？')) {
    members = members.filter(m => m.id !== id);
    save();
    render();
  }
};

$('#addBtn').onclick = () => openModal(null);
$('#cancelBtn').onclick = () => $('#dialog').close();
$('#search').oninput = render;

$('#memberForm').onsubmit = e => {
  e.preventDefault();
  const id = $('#editId').value || ('m' + Date.now());
  const data = {
    id,
    name: $('#name').value.trim(),
    image1: $('#image1').value.trim(),
    image2: $('#image2').value.trim(),
    memo: $('#memo').value.trim()
  };
  const i = members.findIndex(m => m.id === id);
  if(i >= 0) members[i] = data; else members.push(data);
  save();
  $('#dialog').close();
  render();
};

$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(members, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'member-memory-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      members = JSON.parse(r.result);
      save();
      render();
      alert('読み込みました');
    } catch {
      alert('JSONの読み込みに失敗しました');
    }
  };
  r.readAsText(f);
};

$('#resetBtn').onclick = () => {
  if(confirm('ブラウザ内の保存データを消して、初期データに戻しますか？')) {
    localStorage.removeItem(KEY);
    members = initialMembers;
    render();
  }
};

render();
</script>
</body>
</html>
