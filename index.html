<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メンバー記憶ページ</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--ink:#18202a;--sub:#697386;--line:#e6e8ef;--accent:#4f46e5;--accent2:#10b981;--danger:#ef4444}
    *{box-sizing:border-box} body{margin:0;font-family:"Yu Gothic",Meiryo,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .wrap{max-width:1100px;margin:0 auto;padding:18px}
    h1{margin:0 0 8px;font-size:clamp(24px,4vw,40px);letter-spacing:.02em}.lead{margin:0;color:var(--sub);line-height:1.7}
    .toolbar{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;margin-top:16px} input,textarea,button{font:inherit}
    input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;outline:none} input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
    button{border:0;border-radius:14px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(79,70,229,.18)}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}button.green{background:var(--accent2)}button.danger{background:var(--danger)}button.small{padding:8px 10px;border-radius:10px;font-size:13px}
    main.wrap{padding-top:22px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--sub)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 28px rgba(16,24,40,.06)}.thumb{aspect-ratio:1/1;background:linear-gradient(135deg,#eef2ff,#ecfeff);display:flex;align-items:center;justify-content:center;color:#9aa4b2;font-weight:700;text-align:center;padding:12px}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:14px}.name{font-size:20px;font-weight:900;margin:0 0 8px}.file{font-size:12px;color:var(--sub);word-break:break-all}.memo{margin-top:10px;color:#344054;line-height:1.55;white-space:pre-wrap}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    dialog{border:0;border-radius:22px;padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:0 24px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(15,23,42,.45)}.modal{padding:20px}.modal h2{margin:0 0 14px}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.right{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}.hint{font-size:13px;color:var(--sub);line-height:1.6}.hidden{display:none!important}
    @media(max-width:720px){.toolbar{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:14px}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>メンバー記憶ページ</h1>
    <p class="lead">Excelから作ったメンバー一覧です。ブラウザ上で追加・編集した内容は、この端末の localStorage に保存されます。</p>
    <div class="toolbar">
      <input id="search" placeholder="名前・画像名・メモで検索" />
      <button class="green" id="addBtn">＋追加</button>
      <button class="secondary" id="exportBtn">保存データ書き出し</button>
      <button class="secondary" id="importBtn">読み込み</button>
      <input type="file" id="importFile" accept="application/json" class="hidden" />
    </div>
  </div>
</header>
<main class="wrap">
  <div class="stats"><span class="pill" id="count"></span><span class="pill">画像は <b>img</b> フォルダに入れる想定</span><span class="pill">Vercel / GitHub Pages対応</span></div>
  <div class="grid" id="grid"></div>
</main>
<dialog id="dialog">
  <form method="dialog" class="modal" id="memberForm">
    <h2 id="modalTitle">メンバー編集</h2>
    <div class="form">
      <input type="hidden" id="editId" />
      <label>名前<input id="name" required placeholder="例：ぬんだこのー" /></label>
      <div class="row"><label>画像ファイル1<input id="image1" placeholder="例：ぬんだこのー.jpeg" /></label><label>画像ファイル2<input id="image2" placeholder="例：タマ2.png" /></label></div>
      <label>メモ<textarea id="memo" rows="5" placeholder="キャラ設定、役割、口癖、ストーリーなどを保存"></textarea></label>
      <p class="hint">画像を表示したい場合は、このHTMLと同じ場所に <b>img</b> フォルダを作り、その中に画像ファイルを入れてください。</p>
    </div>
    <div class="right"><button type="button" class="secondary" id="cancelBtn">キャンセル</button><button type="submit">保存</button></div>
  </form>
</dialog>
<script>
const initialMembers = [
  {id:'m001',name:'ぬんだこのー',image1:'ぬんだこのー.jpeg',image2:'',memo:''},
  {id:'m002',name:'アモン',image1:'アモン.png',image2:'',memo:''},
  {id:'m003',name:'キュン',image1:'キュン.png',image2:'',memo:''},
  {id:'m004',name:'れいちゃん',image1:'れいちゃん.png',image2:'',memo:''},
  {id:'m005',name:'Ryo',image1:'Ryo.png',image2:'',memo:''},
  {id:'m006',name:'わかめ閣下カッカ',image1:'わかめ閣下.png',image2:'',memo:''},
  {id:'m007',name:'崖玄',image1:'崖玄.png',image2:'',memo:''},
  {id:'m008',name:'バルバロッサ',image1:'バルバロッサ.png',image2:'',memo:''},
  {id:'m009',name:'KazNaka',image1:'KazNaka.png',image2:'',memo:''},
  {id:'m010',name:'Yuko',image1:'Yuko.png',image2:'',memo:''},
  {id:'m011',name:'STONE',image1:'STONE.png',image2:'',memo:''},
  {id:'m012',name:'ぴえろ',image1:'ぴえろ.png',image2:'',memo:''},
  {id:'m013',name:'神鎧',image1:'神鎧.png',image2:'',memo:''},
  {id:'m014',name:'上村友二',image1:'上村友二.png',image2:'',memo:''},
  {id:'m015',name:'アスカ',image1:'アスカ.png',image2:'',memo:''},
  {id:'m016',name:'風雲',image1:'風雲.pngフウウン',image2:'',memo:''},
  {id:'m017',name:'タマ',image1:'タマ.png',image2:'タマ2.png',memo:''},
  {id:'m018',name:'SHINOBU',image1:'SHINOBU.png',image2:'',memo:''},
  {id:'m019',name:'たかゆき',image1:'たかゆき.png',image2:'',memo:''},
  {id:'m020',name:'ふじ',image1:'ふじさん.png',image2:'',memo:''},
  {id:'m021',name:'かっぱちゃん',image1:'かっぱちゃん.png',image2:'かっぱちゃん2.png',memo:''},
  {id:'m022',name:'皇帝ペンギン',image1:'皇帝ペンギン.png',image2:'',memo:''},
  {id:'m023',name:'ミートウ',image1:'ミートウ.png',image2:'',memo:''},
  {id:'m024',name:'ゴリラ丸',image1:'ゴリラ丸.png',image2:'',memo:''},
  {id:'m025',name:'桃じり麗',image1:'桃じり麗.png',image2:'',memo:''},
  {id:'m026',name:'舜天',image1:'舜天.png',image2:'',memo:''},
  {id:'m027',name:'獅子神楽',image1:'獅子神楽.pngシシカグラ',image2:'獅子神楽2.png',memo:''},
  {id:'m028',name:'みっか',image1:'みっか.png',image2:'',memo:''},
  {id:'m029',name:'エタニティー',image1:'エタニティー.png',image2:'',memo:''}
];
const KEY='member-memory-v1';
let members = JSON.parse(localStorage.getItem(KEY) || 'null') || initialMembers;
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){ localStorage.setItem(KEY, JSON.stringify(members)); }
function imgTag(file,name){ if(!file) return `<div class="thumb">${esc(name)}</div>`; const src='img/'+file; return `<div class="thumb"><img src="${esc(src)}" alt="${esc(name)}" onerror="this.remove();this.parentElement.textContent='画像なし：${esc(file)}';" /></div>`; }
function render(){
  const q=$('#search').value.trim().toLowerCase();
  const filtered=members.filter(m=>(m.name+' '+m.image1+' '+m.image2+' '+m.memo).toLowerCase().includes(q));
  $('#count').textContent=`登録 ${members.length}件 / 表示 ${filtered.length}件`;
  $('#grid').innerHTML=filtered.map(m=>`<article class="card">${imgTag(m.image1,m.name)}<div class="body"><h3 class="name">${esc(m.name)}</h3><div class="file">${esc(m.image1||'画像1未設定')}${m.image2?'<br>'+esc(m.image2):''}</div>${m.memo?`<div class="memo">${esc(m.memo)}</div>`:''}<div class="actions"><button class="small secondary" onclick="editMember('${m.id}')">編集</button><button class="small danger" onclick="deleteMember('${m.id}')">削除</button></div></div></article>`).join('');
}
function openModal(member){ $('#memberForm').reset(); $('#editId').value=member?.id||''; $('#modalTitle').textContent=member?'メンバー編集':'メンバー追加'; $('#name').value=member?.name||''; $('#image1').value=member?.image1||''; $('#image2').value=member?.image2||''; $('#memo').value=member?.memo||''; $('#dialog').showModal(); }
window.editMember=id=>openModal(members.find(m=>m.id===id));
window.deleteMember=id=>{ if(confirm('削除しますか？')){ members=members.filter(m=>m.id!==id); save(); render(); } };
$('#addBtn').onclick=()=>openModal(null); $('#cancelBtn').onclick=()=>$('#dialog').close(); $('#search').oninput=render;
$('#memberForm').onsubmit=e=>{ e.preventDefault(); const id=$('#editId').value || ('m'+Date.now()); const data={id,name:$('#name').value.trim(),image1:$('#image1').value.trim(),image2:$('#image2').value.trim(),memo:$('#memo').value.trim()}; const i=members.findIndex(m=>m.id===id); if(i>=0) members[i]=data; else members.push(data); save(); $('#dialog').close(); render(); };
$('#exportBtn').onclick=()=>{ const blob=new Blob([JSON.stringify(members,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='member-memory-backup.json'; a.click(); URL.revokeObjectURL(a.href); };
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ members=JSON.parse(r.result); save(); render(); alert('読み込みました'); }catch(err){ alert('JSONの読み込みに失敗しました'); } }; r.readAsText(f); };
render();
</script>
</body>
</html>
